spring:
  datasource:
    url: jdbc:h2:mem:portfolio
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
server:
  port: ${PORT:8080}
portfolio:
  cors-origin: ${FRONTEND_URL:http://localhost:5173}
